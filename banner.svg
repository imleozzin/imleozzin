<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Leonardo Ramalho — Analista de TI | Blue Team / SOC">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- janela -->
  <rect x="1" y="1" width="1198" height="328" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 15 a14 14 0 0 1 14 -14 h1170 a14 14 0 0 1 14 14 v33 h-1198 z" fill="#161b22"/>
  <line x1="1" y1="48" x2="1199" y2="48" stroke="#30363d" stroke-width="2"/>
  <circle cx="30" cy="25" r="7" fill="#f85149"/>
  <circle cx="54" cy="25" r="7" fill="#d29922"/>
  <circle cx="78" cy="25" r="7" fill="#3fb950"/>
  <text x="600" y="31" text-anchor="middle" class="mono" font-size="15" fill="#8b949e">leonardo@blueteam: ~</text>

  <!-- whoami -->
  <text x="40" y="98" class="mono" font-size="20"><tspan fill="#3fb950">$</tspan><tspan fill="#8b949e" dx="12">whoami</tspan></text>
  <text x="40" y="150" class="mono" font-size="42" font-weight="700" fill="#e6edf3">Leonardo Ramalho</text>
  <text x="40" y="186" class="mono" font-size="21" fill="#58a6ff">Analista de TI  ·  Blue Team / SOC</text>

  <!-- foco -->
  <text x="40" y="238" class="mono" font-size="20"><tspan fill="#3fb950">$</tspan><tspan fill="#8b949e" dx="12">cat foco.txt</tspan></text>
  <text x="40" y="272" class="mono" font-size="20" fill="#e6edf3">Active Directory · Hardening · Detecção com SIEM · Resposta a incidentes</text>

  <!-- prompt -->
  <text x="40" y="308" class="mono" font-size="20" fill="#3fb950">$</text>
  <rect class="cursor" x="64" y="291" width="12" height="21" fill="#e6edf3"/>

  <!-- escudo -->
  <g transform="translate(1010 86)" fill="none" stroke="#58a6ff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
    <path d="M60 0 L120 22 V78 C120 118 94 146 60 160 C26 146 0 118 0 78 V22 Z"/>
    <path d="M34 80 L54 100 L90 58" stroke="#3fb950"/>
  </g>
</svg>
